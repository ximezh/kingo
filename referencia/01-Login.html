<h1 style="position:relative;font-size:34px;line-height:1.2;font-weight:600;max-width:340px">Cada pedido, en su lugar.</h1>

<div style="flex:1;display:flex;align-items:center;justify-content:center;padding:48px">
<form style="width:360px;display:flex;flex-direction:column;gap:22px">
<h2 style="font-size:26px;font-weight:600">Iniciar sesión</h2>
<div>
<label class="lbl" for="usr">Usuario</label>
<input class="inp" id="usr" type="text" placeholder="Tu usuario">
</div>
<div>
<label class="lbl" for="pwd">Contraseña</label>

</div>
<a class="btn p" href="02-Principal.html" style="width:100%">Entrar</a></form>
</div>
</div>
<script>
(function(){
var q=new URLSearchParams(location.search);
var kg=document.querySelector('.kg');
if(q.get('modo')==='oscuro'){kg.classList.add('dark');document.body.style.background='#0D0D0D';}
var rol=q.get('rol')==='admin'?'admin':'cajero';
var tipo=['local','llevar','domicilio'].indexOf(q.get('tipo'))>-1?q.get('tipo'):'domicilio';
document.querySelectorAll('[data-if]').forEach(function(e){var k=e.getAttribute('data-if');var on=(k==='admin'||k==='cajero')?k===rol:k===tipo;e.style.display=on?'contents':'none';});
var R={admin:['AD','Administrador'],cajero:['CJ','Cajero']};
document.querySelectorAll('[data-rol-ini]').forEach(function(e){e.textContent=R[rol][0];});
document.querySelectorAll('[data-rol-name]').forEach(function(e){e.textContent=R[rol][1];});
var T={local:['En local','Mesa del cliente'],llevar:['Para llevar','Datos de recolecci\u00f3n'],domicilio:['A domicilio','Datos de entrega']};
document.querySelectorAll('[data-tipo]').forEach(function(e){e.textContent=T[tipo][0];});
document.querySelectorAll('[data-titulo]').forEach(function(e){e.textContent=T[tipo][1];});
document.querySelectorAll('a[href]').forEach(function(a){
 var h=a.getAttribute('href');
 if(!/^\d\d-.*\.html$/.test(h))return;
 var p=[];if(q.get('modo'))p.push('modo='+q.get('modo'));if(q.get('rol'))p.push('rol='+q.get('rol'));
 var t=a.getAttribute('data-tipo-link');if(t)p.push('tipo='+t);else if(q.get('tipo'))p.push('tipo='+q.get('tipo'));
 if(p.length)a.setAttribute('href',h+'?'+p.join('&'));
});
})();
</script>
